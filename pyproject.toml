[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-procurement-swarm"
version = "0.2.0"
description = "Agentic e-procurement auction platform with multi-criteria scoring"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "structlog>=24.0.0",
    "pytest>=7.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.5.0"]
dev = ["ruff>=0.4.0", "mypy>=1.10.0", "pytest-cov>=5.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "orchestration", "configs"]

[tool.hatch.build.targets.wheel.force-include]
"configs/base.yaml" = "configs/base.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
